version: "1.0"
name: "Sample Workflow"
description: "This is a sample workflow specification."
agents:
  - name: "Agent A"
    type: "Type A"
    description: "This agent does something."
    system_message: "System message for Agent A."
    prompt: "Prompt for Agent A."
  - name: "Agent B"
    type: "Type B"
    description: "This agent does something else."
    system_message: "System message for Agent B."
    prompt: "Prompt for Agent B."
  - name: "Agent C"
    type: "Type C"
    description: "This agent does something else."
    system_message: "System message for Agent C."
    prompt: "Prompt for Agent C."
workflow:
  - from: "Agent A"
    to: "Agent B"
  - from: "Agent B"
    to: "Agent C"